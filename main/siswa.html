<!-- Kartu detail siswa -->

      <!-- Tombol Tutup di pojok kanan atas banner -->

            01

          <h2 id="modal-name" class="font-display text-xl sm:text-2xl font-bold text-[#E7ECF2] leading-tight">Nama Lengkap</h2>

        </div>
      </div>

      <!-- Detail Biodata -->

        </div>

</div>

  const grid = document.getElementById("student-grid");
  const emptyState = document.getElementById("empty-state");
  const searchInput = document.getElementById("search");

  function renderStudents(list) {
    grid.innerHTML = list.map((s) => {
      const padNo = String(s.no).padStart(2, "0");
      const nicknameDisplay = (s.nickname && s.nickname !== "-") ? `Panggilan: ${s.nickname}` : "XII A TJKT";
      return `
        <button data-no="${s.no}" class="student-card card-hover group flex flex-col rounded-xl border border-line bg-surface overflow-hidden text-left w-full transition focus:outline-none">
          <!-- Banner Foto Siswa -->
          <div class="w-full h-48 sm:h-52 bg-surface2 relative overflow-hidden">
            <img src="/assets/img/siswa/${padNo}.jpg" alt="${s.name}"
                 class="w-full h-full object-cover object-top transition-transform duration-300 group-hover:scale-105"
                 onerror="this.style.display='none'; this.nextElementSibling.style.display='grid';" />
            <div class="hidden absolute inset-0 place-items-center bg-gradient-to-br from-accent/20 via-surface2 to-surface font-mono text-4xl font-bold text-accent/60">
              ${padNo}
            </div>
            <div class="absolute inset-0 bg-gradient-to-t from-surface via-transparent to-transparent opacity-60 pointer-events-none"></div>
            <!-- Badge Absen -->
            <div class="absolute top-3 right-3 px-2.5 py-0.5 rounded-md bg-ink/80 backdrop-blur border border-line font-mono text-xs text-accent">
              #${padNo}
            </div>
          </div>

          <!-- Info Siswa -->
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <h3 class="font-display font-semibold text-base text-[#E7ECF2] group-hover:text-accent transition-colors line-clamp-1">${s.name}</h3>
              <p class="text-xs text-muted font-mono mt-1">${nicknameDisplay}</p>
            </div>
            <div class="mt-4 pt-3 border-t border-line/60 flex items-center justify-between text-xs text-muted font-mono">
              <span class="group-hover:text-[#E7ECF2] transition-colors">Lihat Biodata</span>
              <span class="text-accent group-hover:translate-x-1 transition-transform">&rarr;</span>
            </div>
          </div>
        </button>
      `;
    }).join("");
    emptyState.classList.toggle("hidden", list.length !== 0);
  }

  searchInput.addEventListener("input", (e) => {
    const q = e.target.value.trim().toLowerCase();
    const filtered = students.filter(
      (s) => s.name.toLowerCase().includes(q) || String(s.no).includes(q)
    );
    renderStudents(filtered);
  });

  renderStudents(students);

  // Kartu detail siswa: klik salah satu siswa untuk buka
  const modal = document.getElementById("student-modal");
  const modalClose = document.getElementById("modal-close");

  function openModal(no) {
    const s = students.find((x) => x.no === no);
    if (!s) return;
    const padNo = String(s.no).padStart(2, "0");
    const photo = document.getElementById("modal-photo");
    const avatar = document.getElementById("modal-avatar");
    // reset dulu supaya foto siswa sebelumnya tidak "nyangkut"
    photo.classList.add("hidden");
    avatar.style.display = "grid";
    avatar.textContent = padNo;
    photo.src = `/assets/img/siswa/${padNo}.jpg`;

    document.getElementById("modal-absen").textContent = `ABSEN #${padNo}`;
    document.getElementById("modal-name").textContent = s.name;
    document.getElementById("modal-nickname").textContent = (s.nickname && s.nickname !== "-") ? `Panggilan: ${s.nickname}` : "Panggilan: —";
    document.getElementById("modal-birthday").textContent = (s.birthday && s.birthday !== "-,") ? s.birthday : "—";
    document.getElementById("modal-hobby").textContent = (s.hobby && s.hobby !== "-") ? s.hobby : "—";
    document.getElementById("modal-dream").textContent = (s.dream && s.dream !== "-") ? s.dream : "—";
    document.getElementById("modal-quote").textContent = (s.quote && s.quote !== "-") ? `"${s.quote}"` : "Belum menambahkan quote.";
    modal.classList.remove("hidden");
    modal.classList.add("flex");
  }

  function closeModal() {
    modal.classList.add("hidden");
    modal.classList.remove("flex");
  }

  grid.addEventListener("click", (e) => {
    const card = e.target.closest(".student-card");
    if (!card) return;
    openModal(Number(card.dataset.no));
  });

  modalClose.addEventListener("click", closeModal);
  modal.addEventListener("click", (e) => {
    if (e.target === modal) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeModal();
  });
