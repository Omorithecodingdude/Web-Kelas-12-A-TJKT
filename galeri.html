<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Galeri — XII TJKT A</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      colors: { ink:'#16181B', surface:'#202327', surface2:'#2B2F34', line:'#383D43', muted:'#9BA3AB', accent:'#22D3EE' },
      fontFamily: { display:['Space Grotesk','sans-serif'], sans:['Inter','sans-serif'], mono:['JetBrains Mono','monospace'] }
    } }
  }
</script>
<link rel="stylesheet" href="assets/css/main.css" />
</head>
<body class="bg-ink text-[#E7ECF2] antialiased">

<div id="navbar"></div>

<section class="border-b border-line">
  <div class="max-w-5xl mx-auto px-5 sm:px-8 pt-14 pb-10">
    <p class="font-mono text-xs tracking-[0.2em] text-accent mb-3">// GALERI</p>
    <h1 class="font-display text-3xl sm:text-5xl font-semibold">Momen Kelas</h1>
    <p class="text-muted mt-4 max-w-xl">
      Dokumentasi kegiatan kelas. Ganti placeholder di bawah dengan foto asli
      di folder <code class="font-mono text-accent">assets/img/</code>.
    </p>
  </div>
</section>

<section class="max-w-5xl mx-auto px-5 sm:px-8 py-14">
  <div id="gallery-grid" class="columns-2 sm:columns-3 gap-4 space-y-4"></div>
</section>

<!-- Lightbox -->
<div id="lightbox" class="hidden fixed inset-0 z-[60] bg-ink/95 backdrop-blur items-center justify-center p-6">
  <button id="lightbox-close" class="absolute top-5 right-5 w-10 h-10 rounded-md border border-line grid place-items-center text-[#C4CEDD] hover:border-accent">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.75" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
  </button>
  <div id="lightbox-content" class="max-w-2xl w-full aspect-video rounded-lg border border-line grid place-items-center font-mono text-sm text-muted"></div>
</div>

<div id="footer"></div>

<script>
  // Placeholder gallery data — ganti "label" jadi keterangan foto,
  // dan tambahkan <img src="assets/img/nama-file.jpg"> untuk foto asli.
  const photos = [
    { label: "Kegiatan Praktik Jaringan", h: "h-56", color: "from-accent/25" },
    { label: "Foto Bersama Kelas", h: "h-72", color: "from-accent/25" },
    { label: "Kunjungan Industri", h: "h-48", color: "from-accent/20" },
    { label: "Class Meeting", h: "h-64", color: "from-accent/20" },
    { label: "Upacara Bendera", h: "h-56", color: "from-accent/15" },
    { label: "Lomba Antar Kelas", h: "h-48", color: "from-accent/25" },
    { label: "Praktik Instalasi Fiber Optik", h: "h-72", color: "from-accent/25" },
    { label: "Study Tour", h: "h-56", color: "from-accent/15" },
    { label: "Perpisahan Sementara", h: "h-64", color: "from-accent/20" },
  ];

  const grid = document.getElementById("gallery-grid");
  grid.innerHTML = photos.map((p, i) => `
    <button data-i="${i}" class="gallery-item card-hover w-full break-inside-avoid rounded-lg border border-line bg-gradient-to-br ${p.color} to-surface2 ${p.h} flex items-end p-3 text-left">
      <span class="text-xs font-mono text-[#C4CEDD] bg-ink/60 rounded px-2 py-1">${p.label}</span>
    </button>
  `).join("");

  const lightbox = document.getElementById("lightbox");
  const lightboxContent = document.getElementById("lightbox-content");
  document.getElementById("lightbox-close").addEventListener("click", () => {
    lightbox.classList.add("hidden");
    lightbox.classList.remove("flex");
  });
  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox) {
      lightbox.classList.add("hidden");
      lightbox.classList.remove("flex");
    }
  });
  grid.addEventListener("click", (e) => {
    const btn = e.target.closest(".gallery-item");
    if (!btn) return;
    const p = photos[btn.dataset.i];
    lightboxContent.textContent = p.label + " — ganti dengan <img> foto asli";
    lightbox.classList.remove("hidden");
    lightbox.classList.add("flex");
  });
</script>

<script src="assets/js/components.js" defer></script>
</body>
</html>
